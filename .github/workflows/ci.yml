name: CI

# M1 质量门禁（G1–G6）：lint / typecheck / unit test / build / schema 一致性。
# 评测门禁（G7，需 Postgres + 模型 Key）在 M2 接入，本工作流不含。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates (G1–G6)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: text2sql-garbage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: text2sql-garbage/pnpm-lock.yaml

      # G1 依赖安装（frozen-lockfile 保证 lockfile 与 package.json 一致，否则红）
      - name: "G1 Install"
        run: pnpm install --frozen-lockfile

      # G2 Lint（ESLint 9 flat config，见 eslint.config.mjs）
      - name: "G2 Lint"
        run: pnpm lint

      # G3 类型检查
      - name: "G3 Typecheck"
        run: pnpm typecheck

      # G4 单元测试（vitest，默认 run；覆盖率阈值留待 M1 后续接入 @vitest/coverage-v8）
      - name: "G4 Unit tests"
        run: pnpm test

      # G5 生产构建（同时卡住 SSR/构建期问题，如 @monaco-editor/react 必须 ssr:false）
      - name: "G5 Build"
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # G6 Schema 单一数据源一致性（lib/schema.ts vs test-data/schema.sql）
      - name: "G6 Schema consistency"
        run: pnpm check:schema
